[project]
name = "mental-loader"
version = "0.1.0"
description = "Local-first household assistant feasibility spike"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2,<3",
  "pywebpush>=2,<3",
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mental_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
