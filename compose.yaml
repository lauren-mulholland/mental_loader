services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mental_loader
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: mental_loader
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mental_loader -d mental_loader"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
